<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Календарь занятий</title>
<!-- Подключаем библиотеку Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: #f4f6f9; color: #222; padding: 20px; }
  .app { max-width: 1100px; margin: 0 auto; }
  h1 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .sync-status { font-size: 14px; font-weight: 400; color: #666; display: flex; align-items: center; gap: 5px; }
  .sync-status.active { color: #16a34a; }

  .students { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .view-toggle { display: flex; gap: 5px; margin-bottom: 10px; }
  .view-toggle button { padding: 8px 14px; border: 1px solid #d0d7de; background: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.15s; }
  .view-toggle button.active { background: #4f46e5; color: white; border-color: #4f46e5; }
  
  .students-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .student-btn { padding: 10px 18px; border: 2px solid #d0d7de; background: white; border-radius: 10px; cursor: pointer; font-weight: 500; position: relative; flex: 1; min-width: 150px; text-align: left; }
  .student-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
  .student-btn.all-students { background: #8b5cf6; color: white; border-color: #8b5cf6; flex: 0 0 auto; }
  .student-btn.all-students.active { background: #7c3aed; border-color: #7c3aed; }
  .student-btn .balance { display: block; font-size: 12px; margin-top: 2px; font-weight: 600; }
  .student-btn .price-tag { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .student-btn .edit-student { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(0,0,0,0.1); color: inherit; cursor: pointer; font-size: 12px; opacity: 0; transition: 0.15s; display: flex; align-items: center; justify-content: center; }
  .student-btn:hover .edit-student { opacity: 1; }
  
  .student-dropdown { width: 100%; padding: 12px; border: 2px solid #d0d7de; border-radius: 10px; font-size: 16px; background: white; cursor: pointer; }
  .student-dropdown:focus { outline: none; border-color: #4f46e5; }

  .add-student { padding: 10px 18px; border: 2px dashed #aaa; background: transparent; border-radius: 10px; cursor: pointer; font-weight: 500; color: #555; }
  .add-student:hover { border-color: #4f46e5; color: #4f46e5; }

  .info-bar { background: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .balance-big { font-size: 20px; font-weight: 600; }
  .balance-big.positive { color: #16a34a; }
  .balance-big.negative { color: #dc2626; }
  .balance-big.zero { color: #666; }

  .stats-row { display: flex; gap: 15px; flex-wrap: wrap; }
  .stat-item { text-align: center; padding: 6px 12px; background: #f4f6f9; border-radius: 6px; }
  .stat-item .label { font-size: 11px; color: #666; }
  .stat-item .value { font-size: 16px; font-weight: 600; }
  .stat-item.paid .value { color: #16a34a; }
  .stat-item.unpaid .value { color: #dc2626; }
  .stat-item.planned .value { color: #3b82f6; }
  .stat-item.money .value { color: #f59e0b; }

  .calendar { background: white; border-radius: 10px; padding: 20px; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .cal-header button { padding: 6px 14px; border: 1px solid #d0d7de; background: white; border-radius: 6px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-weight: 600; padding: 8px; color: #666; font-size: 13px; }
  .cal-day { min-height: 110px; border: 1px solid #eee; border-radius: 6px; padding: 6px; cursor: pointer; background: #fafbfc; transition: 0.15s; position: relative; }
  .cal-day:hover { background: #eef2ff; }
  .cal-day.other-month { opacity: 0.35; }
  .cal-day.today { border-color: #4f46e5; background: #eef2ff; }
  .cal-day .date-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .cal-day .day-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; }
  .cal-day .day-actions button { width: 20px; height: 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; opacity: 0; transition: 0.15s; }
  .cal-day:hover .day-actions button { opacity: 1; }
  .cal-day .day-actions .btn-add-lesson { background: #3b82f6; color: white; }
  .cal-day .day-actions .btn-add-payment { background: #f59e0b; color: white; }
  .lesson { font-size: 11px; padding: 3px 6px; border-radius: 4px; margin-bottom: 2px; color: white; cursor: pointer; position: relative; }
  .lesson.planned { background: #3b82f6; }
  .lesson.done { background: #16a34a; }
  .lesson.canceled { background: #9ca3af; text-decoration: line-through; }
  .lesson .student-name { display: block; font-size: 9px; opacity: 0.9; margin-top: 1px; }
  
  .lesson .paid-mark { position: absolute; top: -3px; right: -3px; font-size: 9px; background: #fbbf24; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid white; }
  .lesson .unpaid-mark { position: absolute; top: -3px; right: -3px; font-size: 9px; background: #dc2626; color: white; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: 700; }
  
  .payment-indicator { font-size: 11px; padding: 3px 6px; border-radius: 4px; margin-bottom: 2px; background: #fbbf24; color: #78350f; cursor: pointer; font-weight: 500; }

  .legend { display: flex; gap: 15px; margin-top: 15px; padding: 10px; background: #f4f6f9; border-radius: 6px; flex-wrap: wrap; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal { background: white; padding: 25px; border-radius: 12px; width: 500px; max-width: 95%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 15px; }
  .modal label { display: block; margin-top: 12px; font-size: 13px; color: #555; font-weight: 500; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 6px; margin-top: 4px; font-size: 14px; }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .btn { padding: 9px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
  .btn-primary { background: #4f46e5; color: white; }
  .btn-success { background: #16a34a; color: white; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-warning { background: #f59e0b; color: white; }
  .btn-ghost { background: #eee; color: #333; }
  .btn:hover { opacity: 0.9; }

  .grades-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
  .grades-grid input { text-align: center; }

  .payment-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .total-display { margin-top: 10px; padding: 10px; background: #fef3c7; border-radius: 6px; text-align: center; }
  .total-display .label { font-size: 12px; color: #78350f; }
  .total-display .value { font-size: 22px; font-weight: 700; color: #92400e; }

  .payments-list { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
  .payment-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #fef3c7; border-radius: 6px; margin-bottom: 6px; }
  .payment-item .info { flex: 1; }
  .payment-item .amount { font-weight: 600; color: #92400e; }
  .payment-item .sum { font-size: 12px; color: #78350f; }
  .payment-item .delete { background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <h1>📅 Календарь занятий <span id="syncStatus" class="sync-status">💾 Локально</span></h1>
  <div class="students" id="studentsList"></div>
  <div class="info-bar">
    <div>
      <div style="color:#666; font-size:13px;" id="currentLabel">Текущий ученик</div>
      <div id="currentStudentName" style="font-size:18px; font-weight:600;">—</div>
    </div>
    <div id="statsContainer"></div>
  </div>
  <div class="calendar">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">← Назад</button>
      <div id="monthLabel" style="font-size:18px; font-weight:600;"></div>
      <button onclick="changeMonth(1)">Вперёд →</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- Модалки -->
<div class="modal-bg" id="modalNew">
  <div class="modal">
    <h3>Новое занятие</h3>
    <label>Ученик</label><select id="newStudentSelect"></select>
    <label>Время (ЧЧ:ММ)</label><input type="time" id="newTime" value="18:00">
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveNewLesson()">Создать</button>
      <button class="btn btn-ghost" onclick="closeModal('modalNew')">Отмена</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalPayment">
  <div class="modal">
    <h3>💰 Внесение оплаты</h3>
    <label>Ученик</label><select id="payStudentSelect"></select>
    <label>Дата оплаты</label><input type="date" id="payDate">
    <div class="payment-row">
      <div><label>Внесенная сумма (руб)</label><input type="number" id="paySum" value="" min="0" step="1" placeholder="0"></div>
